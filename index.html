<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人状态面板 - VS Code风格</title>
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-sidebar: #2d2d30;
            --bg-active: #383838;
            --bg-hover: #2a2d2e;
            --border: #3e3e42;
            --text-primary: #cccccc;
            --text-secondary: #969696;
            --text-accent: #d7ba7d;
            --accent-blue: #007acc;
            --accent-green: #4EC9B0;
            --accent-yellow: #FFD700;
            --accent-red: #F44747;
            --card-bg: #252526;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--bg-secondary);
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-text {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-accent);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 10px 0;
            overflow-y: auto;
        }

        .sidebar-title {
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
        }

        .sidebar-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
            border-left: 3px solid transparent;
        }

        .sidebar-item:hover {
            background-color: var(--bg-hover);
        }

        .sidebar-item.active {
            background-color: var(--bg-active);
            border-left-color: var(--accent-blue);
        }

        .sidebar-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            align-content: start;
        }

        .group {
            grid-column: 1 / -1;
            margin-bottom: 20px;
        }

        .group-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-accent);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 16px;
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: var(--accent-blue);
        }

        .card-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        .card-value.past {
            color: var(--accent-red);
        }

        .card-footer {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: var(--bg-sidebar);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress {
            height: 100%;
            background-color: var(--accent-blue);
            border-radius: 2px;
            transition: width 0.5s;
        }

        .tab-bar {
            display: flex;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            border-right: 1px solid var(--border);
            transition: background-color 0.2s;
        }

        .tab.active {
            background-color: var(--bg-primary);
            color: var(--text-accent);
        }

        .tab:hover {
            background-color: var(--bg-hover);
        }

        .footer {
            padding: 8px 16px;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
        }

        .holiday-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 16px;
        }

        .holiday-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-accent);
            margin-bottom: 4px;
        }

        .holiday-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .holiday-countdown {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-yellow);
        }

        .holiday-countdown.past {
            color: var(--accent-red);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-text">个人状态面板</div>
        </div>
        <div class="tab-bar">
            <div class="tab active">状态总览</div>
            <div class="tab">数据统计</div>
            <div class="tab">设置</div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-title">导航</div>
            <div class="sidebar-item active">
                <div class="sidebar-icon">📊</div>
                <span>养老金状态</span>
            </div>
            <div class="sidebar-item">
                <div class="sidebar-icon">📅</div>
                <span>节假日倒计时</span>
            </div>
            <div class="sidebar-item">
                <div class="sidebar-icon">💰</div>
                <span>公积金信息</span>
            </div>
            <div class="sidebar-title">工具</div>
            <div class="sidebar-item">
                <div class="sidebar-icon">📋</div>
                <span>导出数据</span>
            </div>
            <div class="sidebar-item">
                <div class="sidebar-icon">⚙️</div>
                <span>设置</span>
            </div>
        </div>

        <div class="content">
            <!-- 养老金 -->
            <div class="group">
                <div class="group-title">养老金情况</div>
                <div class="cards" id="pension-cards"></div>
            </div>

            <!-- 节假日 -->
            <div class="group">
                <div class="group-title">节假日倒计时</div>
                <div class="cards" id="holiday-cards"></div>
            </div>

            <!-- 公积金 -->
            <div class="group">
                <div class="group-title">公积金累计</div>
                <div class="cards" id="fund-cards"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="status-indicator">
            <div class="indicator-dot"></div>
            <span>系统运行正常</span>
        </div>
        <div>最后更新: <span id="last-update">2025-12-23 15:30</span></div>
    </div>

    <script>
        /* ==================== 通用工具 ==================== */
        function wholeMonthDiff(start, end){
            let years  = end.getFullYear() - start.getFullYear();
            let months = end.getMonth()   - start.getMonth() + years*12;
            if (end.getDate() < start.getDate()) months--;
            return months >= 0 ? months : 0;
        }
        
        function fmt(num){
            return Number(num).toLocaleString('zh-CN',
                    {minimumFractionDigits:2, maximumFractionDigits:2});
        }
        
        function fmtFullDate(d){
            return d.toLocaleDateString('zh-CN',
                    {year:'numeric', month:'long', day:'numeric'});
        }

        /* ==================== 1️⃣ 养老金 ==================== */
        const PENSION_START_DATE    = new Date('2025-11-01T00:00:00');
        const PENSION_INITIAL_MONTHS = 161;
        const PENSION_INITIAL_TOTAL  = 56631.18;
        const PENSION_MONTHLY_CONTRIB = 396.16;
        const PENSION_TARGET_MONTHS   = 240;
        const PENSION_COUNTER_MONTHS_63 = 103;

        function renderPensionCards(){
            const now = new Date();
            const monthsSinceStart = wholeMonthDiff(PENSION_START_DATE, now);
            const totalMonths = PENSION_INITIAL_MONTHS + monthsSinceStart;
            const currentTotal = PENSION_INITIAL_TOTAL + monthsSinceStart * PENSION_MONTHLY_CONTRIB;
            const remainingMonths = Math.max(0, PENSION_TARGET_MONTHS - totalMonths);
            const remainingYears  = Math.floor(remainingMonths / 12);
            const remainingMLeft  = remainingMonths % 12;
            const futureTotal = currentTotal + remainingMonths * PENSION_MONTHLY_CONTRIB;
            const monthlyBenefit = futureTotal / PENSION_COUNTER_MONTHS_63 + 495*2;

            const items = [
                {title:'已缴纳总额',          value:`${fmt(currentTotal)} 元`},
                {title:'已缴纳月数',          value:`${totalMonths} 个月`},
                {title:'距离满20年还有',      value:`${remainingYears} 年 ${remainingMLeft} 个月`},
                {title:'预计满20年总额',      value:`${fmt(futureTotal)} 元`},
                {title:'预计每月领取（计发月数 103）', value:`${fmt(monthlyBenefit)} 元/月`}
            ];

            const container = document.getElementById('pension-cards');
            container.innerHTML = '';
            items.forEach(it => {
                const card = document.createElement('div'); 
                card.className='card';
                
                const title = document.createElement('div'); 
                title.className='card-title'; 
                title.textContent=it.title;
                
                const val = document.createElement('div'); 
                val.className='card-value';   
                val.textContent=it.value;
                
                card.append(title, val);
                container.appendChild(card);
            });
        }

        /* ==================== 2️⃣ 节假日 ==================== */
        const CNY = {
            2024:'2024-02-10', 2025:'2025-01-29', 2026:'2026-02-17',
            2027:'2027-02-06', 2028:'2028-01-26', 2029:'2029-02-13',
            2030:'2030-02-03', 2031:'2031-01-23', 2032:'2032-02-11',
            2033:'2033-01-31', 2034:'2034-02-19', 2035:'2035-02-08'
        };
        const QINGMING = {
            2024:'2024-04-04', 2025:'2025-04-04', 2026:'2026-04-05',
            2027:'2027-04-04', 2028:'2028-04-04', 2029:'2029-04-04',
            2030:'2030-04-04', 2031:'2031-04-05', 2032:'2032-04-04',
            2033:'2023-04-04', 2034:'2034-04-05', 2035:'2035-04-04'
        };
        
        function fixedHoliday(name, month, day, year){
            return {name, date:new Date(`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}T00:00:00`)};
        }
        
        function marriageAnniversary(year){
            const annNum = year - 2018;
            return {name:`结婚纪念日（第${annNum}周年）`, date:new Date(`${year}-06-21T00:00:00`)};
        }
        
        function holidaysOfYear(y){
            return [
                fixedHoliday('元旦',     1, 1, y),
                fixedHoliday('情人节',   2,14, y),
                {name:'春节',   date:new Date(CNY[y]+'T00:00:00')},
                {name:'清明节', date:new Date(QINGMING[y]+'T00:00:00')},
                fixedHoliday('劳动节',  5, 1, y),
                marriageAnniversary(y)
            ];
        }
        
        function monthDayDiff(now, target){
            let years  = target.getFullYear() - now.getFullYear();
            let months = target.getMonth()    - now.getMonth() + years*12;
            let days   = target.getDate() - now.getDate();
            if (days < 0){
                months--;
                const prevMonthLastDay = new Date(target.getFullYear(), target.getMonth(), 0).getDate();
                days = prevMonthLastDay + days;
            }
            if (months < 0) months = 0;
            return {months, days};
        }
        
        function getNextSixHolidays(){
            const now = new Date();
            const thisY = now.getFullYear();
            const years = [thisY, thisY+1, thisY+2];
            const all = [];
            years.forEach(y => holidaysOfYear(y).forEach(it => {
                if (!isNaN(it.date.getTime())) all.push(it);
            }));
            return all.filter(it=>it.date>=now).sort((a,b)=>a.date-b.date).slice(0,6);
        }
        
        function renderHolidayCards(){
            const container = document.getElementById('holiday-cards');
            container.innerHTML = '';
            const now = new Date();
            const holidays = getNextSixHolidays();

            holidays.forEach(ev => {
                const card = document.createElement('div'); 
                card.className='holiday-card';
                
                const title = document.createElement('div'); 
                title.className='holiday-name'; 
                title.textContent=ev.name;
                
                const dateDiv = document.createElement('div'); 
                dateDiv.className='holiday-date'; 
                dateDiv.textContent=fmtFullDate(ev.date);
                
                const val = document.createElement('div'); 
                val.className='holiday-countdown';
                
                const diff = ev.date - now;
                if (diff <= 0){
                    val.textContent = '已过去';
                    val.classList.add('past');
                }else{
                    const {months, days} = monthDayDiff(now, ev.date);
                    val.textContent = `剩余 ${months}月${days}天`;
                }
                
                card.append(title, dateDiv, val);
                container.appendChild(card);
            });
        }

        /* ==================== 3️⃣ 公积金 ==================== */
        const FUND_INITIAL        = 71058;   // 初始金额（元）
        const FUND_MONTHLY_ADD    = 2000;    // 每月增加（元）
        const FUND_CURRENT_MONTHS = 162;    // 已缴纳月份数（只用于后面的"社保满20年后"计算）
        const FUND_TARGET_MONTHS  = 240;    // 满 20 年的总月份

        function renderFundCards(){
            // 已缴纳公积金：保持原始基数（不累计已缴月份）
            const currentFund = FUND_INITIAL;   // 71 058 元

            // 社保满20年后：只算剩余月份的累计
            const remainingMonths = FUND_TARGET_MONTHS - FUND_CURRENT_MONTHS;   // 240‑162 = 78
            const futureFund = FUND_INITIAL + remainingMonths * FUND_MONTHLY_ADD; // 71 058 + 78*2000 = 227 058

            const items = [
                {title:'已缴纳公积金',                               value:`${fmt(currentFund)} 元`},
                {title:'社保缴满20年后预计公积金总额',               value:`${fmt(futureFund)} 元`}
            ];
            const container = document.getElementById('fund-cards');
            container.innerHTML = '';
            items.forEach(it => {
                const card = document.createElement('div'); 
                card.className='card';
                
                const title = document.createElement('div'); 
                title.className='card-title'; 
                title.textContent=it.title;
                
                const val = document.createElement('div'); 
                val.className='card-value';   
                val.textContent=it.value;
                
                card.append(title, val);
                container.appendChild(card);
            });
        }

        /* ==================== 初始化 & 自动刷新 ==================== */
        function updateLastUpdate() {
            const now = new Date();
            const formatted = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('last-update').textContent = formatted;
        }

        // 侧边栏交互
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 标签页交互
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });

        renderPensionCards();
        renderHolidayCards();
        renderFundCards();
        updateLastUpdate();
        
        setInterval(()=>{
            renderPensionCards();
            renderHolidayCards();
            renderFundCards();
            updateLastUpdate();
        }, 60000);   // 每分钟刷新一次
    </script>
</body>
</html>
