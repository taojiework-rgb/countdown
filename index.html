<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>5 张养老金卡 + 6 张节假日倒计时卡</title>
<style>
  :root{
    --bg-main:#0f1724;      /* 页面整体背景 */
    --bg-card:#1f2937;      /* 卡片背景 */
    --c-title:#a0a0a0;     /* 卡片标题/日期颜色 */
    --c-val:#bfe6a8;       /* 主要数字颜色 */
    --accent:#bfe6a8;       /* 强调色 */
    --accent-hover:#def5c5;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    min-height:100vh;
    margin:0;
    background:var(--bg-main);
    color:#e0e0e0;
    font-family:sans-serif;
    gap:30px;
    padding:30px 15px;
  }
  h1{
    font-size:1.9rem;
    color:var(--c-val);
    margin:0;
    text-shadow:0 0 8px rgba(191,230,168,.6);
  }
  .section{
    width:100%;
    max-width:1300px;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:25px;
    justify-items:center;
  }
  .card{
    background:var(--bg-card);
    border-radius:15px;
    padding:20px 25px;
    box-shadow:0 0 15px rgba(0,0,0,.3);
    text-align:center;
    width:100%;
    max-width:320px;
    transition:transform .2s;
  }
  .card:hover{
    transform:translateY(-3px);
  }
  .card-title{
    font-size:1.12rem;
    color:var(--c-title);
    margin-bottom:6px;
  }
  .card-date{
    font-size:0.94rem;
    color:var(--c-title);
    margin-bottom:4px;
  }
  .card-value{
    font-size:1.78rem;
    color:var(--c-val);
    font-weight:600;
    line-height:1.4;
    margin-top:4px;
  }
  .card-value.past{
    color:#f87171;               /* 已过去的节假日显示红色 */
    font-weight:400;
  }
</style>
</head>
<body>

<h1>5 张养老金卡 + 6 张节假日倒计时卡</h1>

<!-- ------------- 养老金（5 张卡） ------------- -->
<div class="section">
  <div class="cards" id="pension-cards">
    <!-- JS 会在这里生成 5 张卡 -->
  </div>
</div>

<!-- ------------- 节假日（6 张卡） ------------- -->
<div class="section">
  <div class="cards" id="holiday-cards">
    <!-- JS 会在这里生成 6 张卡 -->
  </div>
</div>

<script>
/* =========================================================
   1️⃣ 养老金计算（5 条信息 → 5 张卡）
   ========================================================= */
const START_DATE    = new Date('2025-11-01T00:00:00'); // 统计起始时间
const INITIAL_MONTHS = 161;          // 已累计的完整月数
const INITIAL_TOTAL  = 56631.18;     // 已累计的金额（元）
const MONTHLY_CONTRIB = 396.16;     // 每月继续缴纳（元）
const TARGET_TOTAL_MONTHS = 240;    // 满 20 年 = 240 个月
const COUNTER_MONTHS_63 = 103;     // 计发月数（63 岁退休，江苏省）

/* 计算从 start 到 end 的完整月份数（不计未满本月） */
function wholeMonthDiff(start, end){
  let years  = end.getFullYear() - start.getFullYear();
  let months = end.getMonth()   - start.getMonth() + years*12;
  if (end.getDate() < start.getDate()) months--;
  return months >= 0 ? months : 0;
}

/* 金额千分位 + 保留两位小数 */
function fmt(num){
  return Number(num).toLocaleString('zh-CN',
          {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* 渲染 5 张养老金卡 */
function renderPensionCards(){
  const now = new Date();

  const monthsSinceStart = wholeMonthDiff(START_DATE, now);
  const totalMonths = INITIAL_MONTHS + monthsSinceStart;               // 已缴纳月数

  const currentTotal = INITIAL_TOTAL + monthsSinceStart * MONTHLY_CONTRIB; // 已累计金额

  const remainingMonths = Math.max(0, TARGET_TOTAL_MONTHS - totalMonths);
  const remainingYears  = Math.floor(remainingMonths / 12);
  const remainingMLeft  = remainingMonths % 12;

  const futureTotal = currentTotal + remainingMonths * MONTHLY_CONTRIB; // 满 20 年后累计

  const monthlyBenefit = futureTotal / COUNTER_MONTHS_63;               // 退休后每月可领

  const items = [
    {title:'已缴纳总额',           value:`${fmt(currentTotal)} 元`},
    {title:'已缴纳月数',           value:`${totalMonths} 个月`},
    {title:'距离满20年还有',       value:`${remainingYears} 年 ${remainingMLeft} 个月`},
    {title:'预计满20年总额',       value:`${fmt(futureTotal)} 元`},
    {title:'预计每月领取（计发月数 103）', value:`${fmt(monthlyBenefit)} 元/月`}
  ];

  const container = document.getElementById('pension-cards');
  container.innerHTML = '';               // 清空旧卡

  items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'card';

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = it.title;
    card.appendChild(title);

    const val = document.createElement('div');
    val.className = 'card-value';
    val.textContent = it.value;
    card.appendChild(val);

    container.appendChild(card);
  });
}

/* 首次渲染 + 每分钟更新 */
renderPensionCards();
setInterval(renderPensionCards, 60000);

/* =========================================================
   2️⃣ 节假日（6 张卡）——元旦、情人节、春节、清明节、劳动节、结婚纪念日
   ========================================================= */
const CNY = {                     // 春节（农历新年）对应的公历日期
  2024:'2024-02-10', 2025:'2025-01-29', 2026:'2026-02-17',
  2027:'2027-02-06', 2028:'2028-01-26', 2029:'2029-02-13',
  2030:'2030-02-03', 2031:'2031-01-23', 2032:'2032-02-11',
  2033:'2033-01-31', 2034:'2034-02-19', 2035:'2035-02-08'
};
const QINGMING = {                // 清明节（公历 4 月 4/5 日）
  2024:'2024-04-04', 2025:'2025-04-04', 2026:'2026-04-05',
  2027:'2027-04-04', 2028:'2028-04-04', 2029:'2029-04-04',
  2030:'2030-04-04', 2031:'2031-04-05', 2032:'2032-04-04',
  2033:'2023-04-04', 2034:'2034-04-05', 2035:'2035-04-04'
};

/* 固定日期的假期（元旦、劳动节、情人节） */
function fixedHoliday(name, month, day, year){
  return {
    name,
    date:new Date(`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}T00:00:00`)
  };
}

/* 结婚纪念日（每年 6 月 21 日） */
function marriageAnniversary(year){
  const annNum = year - 2018;   // 第几周年，2018 为基准年
  return {
    name:`结婚纪念日（第${annNum}周年）`,
    date:new Date(`${year}-06-21T00:00:00`)
  };
}

/* 某一年所有需要展示的节日（返回 6 条对象） */
function holidaysOfYear(year){
  return [
    fixedHoliday('元旦',     1, 1, year),
    fixedHoliday('情人节',   2,14, year),
    { name:'春节',   date:new Date(CNY[year]+'T00:00:00') },
    { name:'清明节', date:new Date(QINGMING[year]+'T00:00:00') },
    fixedHoliday('劳动节',  5, 1, year),
    marriageAnniversary(year)                // 结婚纪念日
  ];
}

/* -------------------------------------------------------
   计算 “X月Y天” 差值（不计闰秒，仅月份/天）
   ------------------------------------------------------- */
function monthDayDiff(now, target){
  let years  = target.getFullYear() - now.getFullYear();
  let months = target.getMonth()    - now.getMonth() + years*12;
  let days   = target.getDate() - now.getDate();

  if (days < 0){
    months--;
    const prevMonthLastDay = new Date(target.getFullYear(), target.getMonth(), 0).getDate();
    days = prevMonthLastDay + days;
  }
  if (months < 0) months = 0;
  return {months, days};
}

/* -------------------------------------------------------
   取最近的 6 条尚未到来的节日（跨年自动向后搜索）
   ------------------------------------------------------- */
function getNextSixHolidays(){
  const now = new Date();
  const thisYear = now.getFullYear();

  // 向后检查 3 年，确保能拿到 6 条记录（节假日不多，3 年足够）
  const yearsToCheck = [thisYear, thisYear+1, thisYear+2];
  const all = [];

  yearsToCheck.forEach(y => {
    holidaysOfYear(y).forEach(item => {
      if (!isNaN(item.date.getTime())) {
        all.push(item);
      } else {
        console.warn(`年份 ${y} 的 ${item.name} 日期无效`);
      }
    });
  });

  // 按时间正序，过滤过去的，取前 6 条
  const upcoming = all
    .filter(item => item.date.getTime() >= now.getTime())
    .sort((a,b)=> a.date - b.date)
    .slice(0,6);

  return upcoming;
}

/* -------------------------------------------------------
   渲染节假日卡片（每分钟刷新一次）
   ------------------------------------------------------- */
function renderHolidayCards(){
  const container = document.getElementById('holiday-cards');
  container.innerHTML = '';                     // 清空旧卡

  const now = new Date();
  const holidays = getNextSixHolidays();

  holidays.forEach(ev => {
    const card = document.createElement('div');
    card.className = 'card';

    // 标题
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = ev.name;
    card.appendChild(title);

    // 日期
    const dateDiv = document.createElement('div');
    dateDiv.className = 'card-date';
    dateDiv.textContent = ev.date.toLocaleDateString('zh-CN',
      {year:'numeric', month:'long', day:'numeric'});
    card.appendChild(dateDiv);

    // 倒计时或已过去
    const value = document.createElement('div');
    value.className = 'card-value';
    const diff = ev.date - now;
    if (diff <= 0){
      value.textContent = '已过去';
      value.classList.add('past');
    }else{
      const {months, days} = monthDayDiff(now, ev.date);
      value.textContent = `剩余 ${months}月${days}天`;
    }
    card.appendChild(value);

    container.appendChild(card);
  });
}

/* 初始渲染 + 每分钟刷新 */
renderHolidayCards();
setInterval(renderHolidayCards, 60000);
</script>

</body>
</html>
