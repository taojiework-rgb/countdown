<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>最近六个节日/纪念日倒计时</title>
<style>
  :root{
    --bg-main:#0f1724;     /* 页面整体背景 */
    --bg-card:#1f2937;     /* 卡片背景 */
    --c-title:#a0a0a0;    /* 标题、日期文字颜色 */
    --c-val:#bfe6a8;      /* 倒计时文字颜色 */
    --accent:#bfe6a8;      /* 按钮等强调色 */
    --accent-hover:#def5c5;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    background:var(--bg-main);
    color:#e0e0e0;
    font-family:sans-serif;
    gap:30px;
    padding:20px;
  }
  h1{
    font-size:1.8rem;
    color:var(--c-val);
    margin:0;
    text-shadow:0 0 8px rgba(191,230,168,.6);
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:25px;
    width:100%;
    max-width:1100px;
  }
  .card{
    background:var(--bg-card);
    border-radius:15px;
    padding:20px 25px;
    box-shadow:0 0 15px rgba(0,0,0,.3);
    text-align:center;
  }
  .card-title{
    font-size:1.1rem;
    color:var(--c-title);
    margin-bottom:8px;
  }
  .card-date{
    font-size:0.96rem;
    color:var(--c-title);
    margin-bottom:6px;
  }
  .card-value{
    font-size:1.8rem;
    color:var(--c-val);
    font-weight:600;
  }
  .card-value.past{
    color:#f87171;          /* 已过去的假期显示红色 */
    font-weight:400;
  }
</style>
</head>
<body>

<h1>最近六个节日/纪念日倒计时</h1>

<div class="cards" id="event-cards"><!-- 卡片将在脚本里自动生成 --></div>

<script>
/* -------------------------------------------------------
   1️⃣ 节假日 & 纪念日数据（自行补充/修改年份）
   ------------------------------------------------------- */
// 春节（农历新年）—— 年份对应的公历日期
const CNY = {
  2024:'2024-02-10',
  2025:'2025-01-29',
  2026:'2026-02-17',
  2027:'2027-02-06',
  2028:'2028-01-26',
  2029:'2029-02-13',
  2030:'2030-02-03',
  2031:'2031-01-23',
  2032:'2032-02-11',
  2033:'2033-01-31',
  2034:'2034-02-19',
  2035:'2035-02-08'
};

// 清明节（公历 4 月 4/5 日）
const QINGMING = {
  2024:'2024-04-04',
  2025:'2025-04-04',
  2026:'2026-04-05',
  2027:'2027-04-04',
  2028:'2028-04-04',
  2029:'2029-04-04',
  2030:'2030-04-04',
  2031:'2031-04-05',
  2032:'2032-04-04',
  2033:'2023-04-04', // 举例：如果没有对应年份，手动补
  2034:'2034-04-05',
  2035:'2035-04-04'
};

/* 固定节日生成函数（元旦、劳动节、情人节、结婚纪念日等） */
function fixedHoliday(name, month, day, year, extra={}){
  return Object.assign({
    name,
    date:new Date(`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}T00:00:00`)
  }, extra);
}

/* 某一年全部需要展示的事件（返回 6 条对象） */
function eventsOfYear(year){
  const marriageYear = 2018;               // 领证年份
  const marriageMonth = 6;
  const marriageDay   = 21;
  const anniversaryNumber = year - marriageYear; // 第几周年（对应的年份）

  return [
    // 元旦
    fixedHoliday('元旦',   1, 1, year),

    // 春节（使用 CNY 对象的具体日期）
    { name:'春节', date:new Date(CNY[year]+'T00:00:00') },

    // 清明节
    { name:'清明节', date:new Date(QINGMING[year]+'T00:00:00') },

    // 劳动节
    fixedHoliday('劳动节',5, 1, year),

    // 情人节（每年 2 月 14 日）
    fixedHoliday('情人节',2,14,year),

    // 结婚纪念日（每年 6 月 21 日），在渲染时会额外显示“第 X 周年”
    fixedHoliday('结婚纪念日', marriageMonth, marriageDay, year, {
      isAnniversary:true,
      anniversaryNumber // 供渲染时使用的数字
    })
  ];
}

/* -------------------------------------------------------
   2️⃣ 计算 “X月Y天” 差值（不考虑闰秒，仅月份/天数）
   ------------------------------------------------------- */
function monthDayDiff(now, target){
  // 先算月份差
  let years  = target.getFullYear() - now.getFullYear();
  let months = target.getMonth()    - now.getMonth() + years*12;

  // 再算天数差
  let days = target.getDate() - now.getDate();

  if (days < 0){
    months--;
    // 前一个月有多少天
    const prevMonthLastDay = new Date(target.getFullYear(), target.getMonth(), 0).getDate();
    days = prevMonthLastDay + days;
  }
  if (months < 0) months = 0;
  return { months, days };
}

/* -------------------------------------------------------
   3️⃣ 获取最近的六个尚未到来的事件（跨年自动向后查）
   ------------------------------------------------------- */
function getNextSixEvents(){
  const now = new Date();
  const thisYear = now.getFullYear();

  // 向后检查三年（足够保证可以取到 6 条记录）
  const yearsToCheck = [thisYear, thisYear+1, thisYear+2];
  const all = [];

  yearsToCheck.forEach(y => {
    const list = eventsOfYear(y);
    list.forEach(item => {
      // 若日期无效则略过
      if (!isNaN(item.date.getTime())) {
        all.push(item);
      } else {
        console.warn(`年份 ${y} 的 ${item.name} 日期无效，已跳过`);
      }
    });
  });

  // 只保留 >= 当前时间的
  const upcoming = all
    .filter(item => item.date.getTime() >= now.getTime())
    .sort((a,b) => a.date - b.date)   // 按时间正序
    .slice(0,6);                       // 取前六条

  return upcoming;
}

/* -------------------------------------------------------
   4️⃣ 渲染卡片（每分钟刷新一次）
   ------------------------------------------------------- */
const container = document.getElementById('event-cards');

/* 用于把 Date 对象格式化为 “2025年1月1日” */
function formatFullDate(date){
  return date.toLocaleDateString('zh-CN',
    { year:'numeric', month:'long', day:'numeric' });
}

/* 渲染函数 */
function renderCards(){
  container.innerHTML = '';
  const events = getNextSixEvents();

  // 若数据不足 6 条（例如年份表缺失），补占位卡片避免页面空白
  const totalNeeded = 6;
  const toRender = events.slice(0,totalNeeded);
  while (toRender.length < totalNeeded) {
    toRender.push({ name:'暂无事件', date:null });
  }

  const now = new Date();

  toRender.forEach(ev => {
    const card = document.createElement('div');
    card.className = 'card';

    // ---- 标题 ----
    const title = document.createElement('div');
    title.className = 'card-title';
    // 对结婚纪念日做特殊处理，加入“第X周年”提示
    if (ev.isAnniversary && ev.date){
      const annNum = ev.anniversaryNumber; // 已在对象里预先算好
      title.textContent = `${ev.name}（第${annNum}周年）`;
    }else{
      title.textContent = ev.name || '--';
    }
    card.appendChild(title);

    // ---- 日期 ----
    const dateDiv = document.createElement('div');
    dateDiv.className = 'card-date';
    dateDiv.textContent = ev.date ? formatFullDate(ev.date) : '--';
    card.appendChild(dateDiv);

    // ---- 倒计时 ----
    const value = document.createElement('div');
    value.className = 'card-value';

    if (!ev.date){
      value.textContent = '--';
    }else{
      const diff = ev.date - now;
      if (diff <= 0){
        value.textContent = '已过去';
        value.classList.add('past');
      }else{
        const {months, days} = monthDayDiff(now, ev.date);
        value.textContent = `剩余 ${months}月${days}天`;
      }
    }
    card.appendChild(value);
    container.appendChild(card);
  });
}

/* 首次渲染 */
renderCards();
/* 每 1 分钟（60000 ms）自动刷新 */
setInterval(renderCards, 60000);
</script>

</body>
</html>
