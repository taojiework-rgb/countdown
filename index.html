<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>个人日志记录板</title>
<style>
  :root{
    --bg-main:#0f1724;
    --bg-card:#1f2937;
    --bg-list:#2a3b4c;
    --c-text:#e0e0e0;
    --c-title:#a0a0a0;
    --c-value:#bfe6a8;
    --accent:#bfe6a8;
    --accent-hover:#def5c5;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    background:var(--bg-main);
    color:var(--c-text);
    font-family:sans-serif;
    gap:25px;
    padding:20px;
  }
  .card{
    background:var(--bg-card);
    padding:25px 30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
    width:100%;
    max-width:560px;
  }
  .card-title{
    font-size:1.2rem;
    color:var(--c-title);
    text-align:center;
    margin-bottom:12px;
  }
  .save-btn{
    display:block;
    margin:0 auto;
    background:var(--accent);
    color:var(--bg-main);
    border:none;
    border-radius:6px;
    padding:8px 20px;
    font-size:0.95rem;
    cursor:pointer;
    transition:background .2s,transform .2s;
  }
  .save-btn:hover{
    background:var(--accent-hover);
    transform:translateY(-2px);
  }
  .form-label{
    display:block;
    margin-bottom:4px;
    color:var(--c-title);
    font-size:0.95rem;
  }
  .form-input,.form-textarea{
    width:100%;
    background:var(--bg-card);
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:6px;
    padding:6px 8px;
    margin-bottom:12px;
    font-size:0.95rem;
    transition:border-color .2s,box-shadow .2s;
  }
  .form-input:focus,
  .form-textarea:focus{
    outline:none;
    border-color:var(--accent-hover);
    box-shadow:0 0 8px rgba(191,230,168,.7);
  }
  .form-textarea{
    min-height:80px;
    resize:vertical;
  }

  #log-list{
    width:100%;
    max-width:560px;
  }
  .log-item{
    background:var(--bg-list);
    border-radius:12px;
    padding:15px 20px;
    margin-bottom:12px;
    color:var(--c-text);
  }
  .log-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:1rem;
    margin-bottom:8px;
  }
  .log-header .log-date{color:var(--accent);font-weight:600;}
  .log-header .log-hours{color:var(--accent);}
  .log-section{
    margin-bottom:6px;
  }
  .log-section strong{
    color:var(--c-title);
  }
  .log-actions{
    text-align:right;
    margin-top:8px;
  }
  .log-actions button{
    background:var(--accent);
    color:var(--bg-main);
    border:none;
    border-radius:5px;
    padding:4px 10px;
    margin-left:6px;
    font-size:0.85rem;
    cursor:pointer;
    transition:background .2s;
  }
  .log-actions button:hover{
    background:var(--accent-hover);
  }
</style>
</head>
<body>

<!-- ======== 添加 / 编辑日志表单 ======== -->
<div class="card" id="log-form">
  <div class="card-title">添加/编辑日志</div>

  <label class="form-label" for="log-date">日期</label>
  <input type="date" id="log-date" class="form-input">

  <label class="form-label" for="log-hours">工时（小时）</label>
  <input type="number" id="log-hours" class="form-input" step="0.5" min="0" placeholder="如 8">

  <label class="form-label" for="log-work">工作内容</label>
  <textarea id="log-work" class="form-textarea" placeholder="今天的工作（必填）"></textarea>

  <label class="form-label" for="log-personal">个人内容</label>
  <textarea id="log-personal" class="form-textarea" placeholder="个人想法、生活记录等（选填）"></textarea>

  <button class="save-btn" id="save-log">保存</button>
</div>

<!-- ======== 已保存的日志列表 ======== -->
<div id="log-list"></div>

<script>
/* ========= 常量与工具函数 ========= */
const dateInput   = document.getElementById('log-date');
const hoursInput  = document.getElementById('log-hours');
const workInput   = document.getElementById('log-work');
const personalInput = document.getElementById('log-personal');
const saveBtn     = document.getElementById('save-log');
const listDiv     = document.getElementById('log-list');

const todayYMD = (()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
dateInput.value = todayYMD;

// 把 ISO 日期转为 “2025年11月12日 星期五”
function formatDisplay(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
}

/* ========= 本地存取 ========= */
const PREFIX = 'log-';   // localStorage 键前缀
let logs = {};           // { '2025-11-12': {date, hours, work, personal, savedAt} }
let editingKey = null;   // null 表示新建；非 null 表示正在编辑的键

function loadLogs(){
  logs = {};
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key.startsWith(PREFIX)){
      const date = key.slice(PREFIX.length);
      try{
        const obj = JSON.parse(localStorage.getItem(key));
        obj.date = date;                // 确保对象里有 date 字段
        logs[date] = obj;
      }catch(e){
        console.warn('读取日志失败',key,e);
      }
    }
  }
}

function renderLogs(){
  listDiv.innerHTML = '';
  const dates = Object.keys(logs).sort((a,b)=> a<b?1:-1); // 新的在前
  if(dates.length===0){
    const p=document.createElement('p');
    p.textContent='暂无日志记录';
    p.style.textAlign='center';
    p.style.color='var(--c-title)';
    listDiv.appendChild(p);
    return;
  }
  dates.forEach(d=>{
    const data = logs[d];
    const item = document.createElement('div');
    item.className='log-item';

    const header = document.createElement('div');
    header.className='log-header';
    header.innerHTML = `<span class="log-date">${formatDisplay(d)}</span>
                       <span class="log-hours">工时：${data.hours ?? 0} 小时</span>`;
    item.appendChild(header);

    const workSec = document.createElement('div');
    workSec.className='log-section';
    workSec.innerHTML = `<strong>工作内容：</strong><p>${data.work||''}</p>`;
    item.appendChild(workSec);

    const personalSec = document.createElement('div');
    personalSec.className='log-section';
    personalSec.innerHTML = `<strong>个人内容：</strong><p>${data.personal||''}</p>`;
    item.appendChild(personalSec);

    const actions = document.createElement('div');
    actions.className='log-actions';
    const editBtn = document.createElement('button');
    editBtn.textContent='编辑';
    editBtn.dataset.date=d;
    const delBtn = document.createElement('button');
    delBtn.textContent='删除';
    delBtn.dataset.date=d;
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    item.appendChild(actions);

    listDiv.appendChild(item);
  });
}

/* ========= 表单处理 ========= */
function clearForm(){
  dateInput.value = todayYMD;
  hoursInput.value = '';
  workInput.value = '';
  personalInput.value = '';
}
function saveLog(){
  const date = dateInput.value.trim();         // yyyy-mm-dd
  if(!date){ alert('请选择日期'); return; }

  const hours  = parseFloat(hoursInput.value) || 0;
  const work   = workInput.value.trim();
  const personal = personalInput.value.trim();

  if(!work){
    alert('请填写“工作内容”。');
    workInput.focus();
    return;
  }

  const key = PREFIX + date;
  const payload = {date, hours, work, personal, savedAt:new Date().toISOString()};

  // 若在编辑且修改了日期，需要删除旧键
  if(editingKey && editingKey!==key){
    localStorage.removeItem(editingKey);
  }

  localStorage.setItem(key, JSON.stringify(payload));

  // 重置编辑状态
  editingKey = null;
  saveBtn.textContent = '保存';
  clearForm();

  loadLogs();
  renderLogs();
}
saveBtn.addEventListener('click', saveLog);

/* ========= 编辑 / 删除 ========= */
listDiv.addEventListener('click', e=>{
  if(e.target.matches('.log-actions button')){
    const date = e.target.dataset.date;
    if(e.target.textContent==='编辑'){
      const data = logs[date];
      if(!data) return;
      editingKey = PREFIX + date;
      dateInput.value    = data.date;
      hoursInput.value   = data.hours ?? '';
      workInput.value    = data.work ?? '';
      personalInput.value= data.personal ?? '';
      saveBtn.textContent = '更新';
    }else if(e.target.textContent==='删除'){
      if(!confirm(`确定删除 ${formatDisplay(date)} 的日志吗？`)) return;
      const k = PREFIX + date;
      localStorage.removeItem(k);
      if(editingKey===k){
        editingKey = null;
        clearForm();
        saveBtn.textContent = '保存';
      }
      loadLogs();
      renderLogs();
    }
  }
});

/* ========= 初始化 ========= */
loadLogs();
renderLogs();

/* ========= 跨天自动回到今天（若未在编辑状态） ========= */
setInterval(()=>{
  const today = todayYMD;
  if(!editingKey && dateInput.value!==today){
    dateInput.value = today;
  }
},60000);
</script>
</body>
</html>
